id = "rainstarfox"
name = "rainStarfox"
version = "0.1.0"
schema_version = 1
description = "rainStarfox (.rsf) language support: syntax highlighting via tree-sitter and LSP via `java -jar rainStarfox-0.9.0.jar lsp`."
repository = "https://github.com/MareAshleyPecker/rainStarfox-lang"
authors = ["rainStarfox contributors"]
themes = []
icon_themes = []
languages = ["languages/rsf"]
capabilities = []

[lib]
kind = "Rust"
version = "0.7.0"

# Zed requires every grammar to be fetched from a git repository: in
# GrammarManifestEntry, `repository` and `rev` are mandatory and `path` is an
# optional sub-directory inside that checkout. There is no "local directory
# only" mode -- omitting `repository` fails with `missing field 'repository'`.
#
# The grammar sources live in this same repository, so the manifest points at
# the repository root and narrows the checkout to editor/zed-rainstarfox/languages/rsf.
# Zed clones it shallowly into grammars/rsf/ (gitignored) and compiles
# <checkout>/editor/zed-rainstarfox/languages/rsf/src/parser.c.
#
# `rev` must be a commit that contains that src/parser.c. Local `file://` fetches
# accept any reachable commit hash, so bumping the repo tip does not break an
# already-pinned rev. After changing grammar.js or regenerating src/, commit and
# update `rev`. For publishing, swap `repository` for the public GitHub URL and
# pin `rev` to a commit pushed there.
[grammars.rsf]
repository = "file:///D:/java/rainStarfox"
rev = "277028741410f8b465362309e6a2c1cafffb3618"
path = "editor/zed-rainstarfox/languages/rsf"

[language_servers.rainstarfox-lsp]
language = "rainStarfox"
languages = []

[language_servers.rainstarfox-lsp.language_ids]

[context_servers]

[slash_commands]
